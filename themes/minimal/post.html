{{> header}}
<article class="post">
  <h1>{{post.title}}</h1>
  {{#if config.show_date}}<time class="post-time">{{post.date}}</time>{{/if}}
  <div class="post-body">{{{post.content}}}</div>
</article>
<section class="comments" id="comments">
  <h2>评论</h2>
  <ol class="comment-list">
  {{#each comments}}
    <li class="comment">
      <span class="comment-author">{{this.author}}</span><span class="comment-date">{{this.date}}</span>
      <p>{{this.content}}</p>
    </li>
  {{else}}
    <li class="empty">暂无评论。</li>
  {{/each}}
  </ol>
  <form method="post" action="{{post.url}}/comment" class="comment-form">
    <input name="author" placeholder="昵称" required maxlength="40">
    <textarea name="content" placeholder="说点什么…" required maxlength="2000"></textarea>
    <button type="submit">发表评论</button>
  </form>
</section>
{{> footer}}
