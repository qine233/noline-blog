<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{site.title}}</title>
<script>
(function(){
  var el=document.documentElement;
  var t=null;try{t=localStorage.getItem('noline-theme');}catch(e){}
  if(t!=='dark'&&t!=='light'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
  el.setAttribute('data-theme',t);
  var reduce=false;try{reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  var vt=false;
  try{var s=new CSSStyleSheet();s.replaceSync('@view-transition{navigation:auto}');vt=s.cssRules.length>0;}catch(e){vt=false;}
  window.__nolineVT=vt;
  if(!vt&&!reduce){el.classList.add('is-loading');setTimeout(function(){el.classList.remove('is-loading');},1500);}
})();
</script>
<link rel="stylesheet" href="/theme.css">
<link rel="alternate" type="application/rss+xml" href="/feed.xml" title="{{site.title}}">
<style>:root{--accent-user:{{config.accent}};--accent-user-rgb:{{accentRgb}};}</style>
</head>
<body>
<div id="noline-progress" aria-hidden="true"></div>
<header class="topbar">
  <div class="topbar-inner">
    <a class="topbar-brand" href="/">
      {{#if config.avatar_url}}<img class="topbar-logo" src="{{config.avatar_url}}" alt="" width="32" height="32">{{/if}}
      <span class="topbar-name">{{site.title}}</span>
    </a>
    <nav class="topnav">
      <a class="nav-item active" href="/">首页</a>
      {{#if authed}}<a class="nav-item" href="/admin">后台</a>{{else}}<a class="nav-item" href="/admin/login">登录</a>{{/if}}
    </nav>
    <form class="topbar-search" method="get" action="/" role="search">
      <input type="search" name="s" placeholder="搜索文章…" value="{{q}}" autocomplete="off">
      <kbd class="search-kbd">/</kbd>
    </form>
    <div class="topbar-actions">
      {{#if config.github_url}}<a class="icon-btn" href="{{config.github_url}}" target="_blank" rel="noopener" title="GitHub">GitHub</a>{{/if}}
      <button type="button" class="icon-btn js-theme-toggle" title="切换深浅色" aria-label="切换深浅色">◐</button>
      {{#if authed}}<form method="post" action="/admin/logout" class="inline"><button type="submit" class="icon-btn">退出</button></form>{{/if}}
    </div>
  </div>
</header>
